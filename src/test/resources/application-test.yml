spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
  sql:
    init:
      mode: never
jwt:
  secret: test-only-secret-key-for-junit-0123456789abcdef
  token:
    access-expiration: 3600000